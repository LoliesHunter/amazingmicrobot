plugins {
    id("io.micronaut.application") version "4.5.3"

    id("io.micronaut.test-resources") version "4.5.3"
    id("io.micronaut.aot") version "4.5.3"
    id("java")
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id("io.freefair.lombok") version "8.4"
}

application {
    mainClass.set("com.example.microbot.Application") // свой главный класс
}


version = "0.1"
group = "com.example.microbot"

repositories {
    mavenCentral()
}
dependencies {
    // Micronaut
    implementation("io.micronaut:micronaut-http-client")
    runtimeOnly("ch.qos.logback:logback-classic")

    // Micronaut Data + PostgreSQL + Hibernate
    implementation("io.micronaut.data:micronaut-data-hibernate-jpa")
    implementation("io.micronaut.sql:micronaut-jdbc-hikari")
    implementation("jakarta.persistence:jakarta.persistence-api")
    runtimeOnly("org.postgresql:postgresql")
    annotationProcessor("io.micronaut.data:micronaut-data-processor")

    // Kafka
    implementation("io.micronaut.kafka:micronaut-kafka")

    // Swagger
    implementation("io.micronaut.openapi:micronaut-openapi")
    annotationProcessor("io.micronaut.openapi:micronaut-openapi")

    implementation("io.swagger.core.v3:swagger-annotations:2.2.15")




    // Lombok
    compileOnly("org.projectlombok:lombok")
    annotationProcessor("org.projectlombok:lombok")

    // Тестирование
    testImplementation("io.micronaut:micronaut-http-client")

    //JSON
    implementation("io.micronaut.serde:micronaut-serde-jackson")
}



application {
    mainClass = "com.example.microbot.Application"
}
java {
    sourceCompatibility = JavaVersion.toVersion("21")
    targetCompatibility = JavaVersion.toVersion("21")
}


graalvmNative.toolchainDetection = false

micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("com.example.microbot.*")
    }
    testResources {
        sharedServer = true
    }
    aot {
        // Please review carefully the optimizations enabled below
        // Check https://micronaut-projects.github.io/micronaut-aot/latest/guide/ for more details
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
        replaceLogbackXml = true
    }
}

tasks.named("test") {
    useJUnitPlatform()
    enabled = false
}


tasks.named("dockerfileNative") {
    jdkVersion = "21"
}

tasks.withType(Jar) {
    manifest {
        attributes(
                'Main-Class': 'com.example.microbot.Application'
        )
    }
}

tasks.named("shadowJar") {
    archiveBaseName.set("app")
    archiveClassifier.set("")
    archiveVersion.set("")
    mergeServiceFiles()
}




