apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot-client
  template:
    metadata:
      labels:
        app: bot-client
    spec:
      containers:
        - name: bot-client
          image: lolieshunter/bot-client:latest

          ports:
            - containerPort: 8080
          env:
            - name: MESSAGE_SAVER_SERVICE_URL
              value: "http://message-saver-service:8081"