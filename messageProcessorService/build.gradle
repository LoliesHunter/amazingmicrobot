plugins {
    id("io.micronaut.application") version "4.5.3"

    id("io.micronaut.test-resources") version "4.5.3"
    id("io.micronaut.aot") version "4.5.3"
    id("java")
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id("io.freefair.lombok") version "8.4"
}

application {
    mainClass.set("com.example.microbotProcessor.Application") // свой главный класс
}

version = "0.1"
group = "com.example.microbotProcessor"

repositories {
    mavenCentral()
}

dependencies {


    implementation("io.micronaut:micronaut-runtime")
    implementation("io.micronaut.kafka:micronaut-kafka")

    // ArangoDB
    implementation("com.arangodb:arangodb-java-driver:6.17.0")

    // OpenAPI (если нужен Swagger)
    implementation("io.micronaut.openapi:micronaut-openapi")
    annotationProcessor("io.micronaut.openapi:micronaut-openapi")
    compileOnly("io.micronaut.openapi:micronaut-openapi-annotations")

    // JSON
    implementation("io.micronaut.serde:micronaut-serde-jackson")

    // Lombok
    compileOnly("org.projectlombok:lombok")
    annotationProcessor("org.projectlombok:lombok")

    // Тестирование
    testImplementation("io.micronaut:micronaut-http-client")


    //http остыль для аранго
    implementation("org.apache.httpcomponents:httpclient:4.5.13")


    //ПОИ
    implementation("org.apache.poi:poi-ooxml:5.2.3")

}


application {
    mainClass = "com.example.microbotProcessor.Application"
}
java {
    sourceCompatibility = JavaVersion.toVersion("21")
    targetCompatibility = JavaVersion.toVersion("21")
}


graalvmNative.toolchainDetection = false

micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("com.example.microbotProcessor.*")
    }
    testResources {
        sharedServer = true
    }
    aot {
        // Please review carefully the optimizations enabled below
        // Check https://micronaut-projects.github.io/micronaut-aot/latest/guide/ for more details
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
        replaceLogbackXml = true
    }
}

tasks.withType(Jar) {
    manifest {
        attributes(
                'Main-Class': 'com.example.microbotProcessor.Application'
        )
    }
}

tasks.named("dockerfileNative") {
    jdkVersion = "21"
}


tasks.named("shadowJar") {
    archiveBaseName.set("app")
    archiveClassifier.set("")
    archiveVersion.set("")
    mergeServiceFiles()
}



